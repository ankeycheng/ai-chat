[project]
name = "ai-chat-backend"
version = "0.1.0"
description = "AI Chat backend (FastAPI + Redis Streams + DeepSeek)"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: tests that hit the real DeepSeek API (need DEEPSEEK_API_KEY)"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["scripts/docker_*.py"]  # ad-hoc Docker smoke scripts (spec §11.3)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC220", "ASYNC110"]
"app/infra/llm/fake.py" = ["ASYNC110"]
"alembic/*" = ["ASYNC240"]
"scripts/*" = ["ASYNC109", "ASYNC230"]
