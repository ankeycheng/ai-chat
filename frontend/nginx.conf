# Load balancer + static frontend. Round-robin, NO session affinity.
resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: every backend replica is an A record

upstream api_backend {
    zone api_backend 64k;
    server backend:8000 resolve;          # re-resolved, so scaled/restarted replicas are picked up
    keepalive 64;
}

map $http_upgrade $connection_upgrade { default ""; }

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;                    # do not disclose the nginx version in headers/error pages
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # metrics are not exposed through the public entrypoint
    location = /api/metrics { deny all; }

    # SSE endpoints: no buffering, no gzip, long read timeout (> PING_INTERVAL_SECONDS)
    location ~ ^/api/(sessions/[^/]+/stream|events)$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        gzip off;
        add_header X-Upstream $upstream_addr always;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        add_header X-Upstream $upstream_addr always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
